name: Sync to Personal Repo

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Org Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push to Personal Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. Add the personal remote using the corrected token syntax
          git remote add personal https://x-access-token:${{ secrets.CLAWHOLICS }}@github.com/John-Benedict-Pereda/clawholics-deploy.git

          # 3. Explicitly push the local HEAD to the remote main branch
          git push personal HEAD:main --force
